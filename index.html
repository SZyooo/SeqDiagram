<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequence Diagram Tool</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Sequence Diagram Tool</h1>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn btn-primary" id="btn-lifeline">+ Lifeline</button>
        <button class="btn btn-primary" id="btn-message">+ Message</button>
        <button class="btn btn-primary" id="btn-fragment">Fragment</button>
      </div>
      <div class="toolbar-group">
        <button class="btn btn-secondary" id="btn-save">Save As</button>
        <button class="btn btn-secondary" id="btn-load">Open</button>
        <button class="btn btn-accent" id="btn-export">Export PNG</button>
        <button class="btn btn-danger" id="btn-clear">Clear</button>
      </div>
      <span class="file-label" id="file-label">Untitled</span>
      <div class="toolbar-group">
        <button class="btn btn-secondary btn-small" id="btn-zoom-out">−</button>
        <span class="zoom-label" id="zoom-label">100%</span>
        <button class="btn btn-secondary btn-small" id="btn-zoom-in">+</button>
        <button class="btn btn-secondary btn-small" id="btn-zoom-reset">Reset</button>
      </div>
      <div class="toolbar-group">
        <button class="btn btn-secondary" id="btn-note">Notes</button>
      </div>
    </div>
  </header>
  <main>
    <div id="diagram"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal-lifeline">
  <div class="modal">
    <div class="modal-header">
      <h2>Add Lifeline</h2>
      <span class="modal-close">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="lifeline-name">Lifeline Name</label>
        <input type="text" id="lifeline-name" placeholder="e.g. User, Server, Database" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="lifeline-attrs">Attributes (one per line)</label>
        <textarea id="lifeline-attrs" placeholder="e.g. - id: int&#10; - name: string" rows="3" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-lifeline">Add</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-message">
  <div class="modal">
    <div class="modal-header">
      <h2>Add Message</h2>
      <span class="modal-close">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label for="message-from">From</label>
          <select id="message-from"></select>
        </div>
        <div class="form-group">
          <label for="message-to">To</label>
          <select id="message-to"></select>
        </div>
      </div>
      <div class="form-group">
        <label for="message-label">Label</label>
        <input type="text" id="message-label" placeholder="e.g. Request, Response" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="message-params">Parameters</label>
        <input type="text" id="message-params" placeholder="e.g. userId, query" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="message-type">Type</label>
        <select id="message-type">
          <option value="request">Request (solid arrow)</option>
          <option value="response">Response (dashed arrow)</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-message">Add</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-fragment">
  <div class="modal">
    <div class="modal-header">
      <h2>Add Fragment</h2>
      <span class="modal-close">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="fragment-label">Label</label>
        <input type="text" id="fragment-label" placeholder="e.g. alt, opt, loop, par" value="alt" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="fragment-start">Start Message</label>
        <select id="fragment-start"></select>
      </div>
      <div class="form-group">
        <label for="fragment-end">End Message</label>
        <select id="fragment-end"></select>
      </div>
      <div class="form-group">
        <label for="fragment-conds">Conditions (comma-separated, optional)</label>
        <input type="text" id="fragment-conds" placeholder="e.g. [x &gt; 0], [else]" autocomplete="off">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-fragment">Add</button>
    </div>
  </div>
</div>

<div id="note-sidebar" class="note-sidebar">
  <div class="note-sidebar-header">
    <span>Notes</span>
    <button id="btn-close-note" class="btn-close-note">&times;</button>
  </div>
  <div class="note-sidebar-body">
    <textarea id="note-text" placeholder="Write your notes here..." spellcheck="false"></textarea>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
